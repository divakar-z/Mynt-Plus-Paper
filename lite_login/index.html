<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Sign in with MYNT" />
<title>Sign in with MYNT</title>
<link rel="icon" href="/favicon.png" />
<style>
  /* Geist loaded async with swap so the page paints immediately in the system
     font and upgrades to Geist when ready — never render-blocking. */
  @font-face{font-family:'Geist';font-weight:400;font-display:swap;src:url('/assets/fonts/Geist/Geist-Regular.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:500;font-display:swap;src:url('/assets/fonts/Geist/Geist-Medium.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:600;font-display:swap;src:url('/assets/fonts/Geist/Geist-SemiBold.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:700;font-display:swap;src:url('/assets/fonts/Geist/Geist-Bold.ttf') format('truetype')}

  :root{
    --primary:#0037B7; --btn:#0037B7; --secondary:#0052CC;
    --bg:#FFFFFF; --panel:#FFFFFF; --card:#FFFFFF;
    --border:#E1E4E8; --divider:#DDE2E7;
    --text:#121212; --text2:#4A4A4A; --text3:#6B6B6B; --err:#FF1717;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --primary:#58A6FF; --btn:#0052CC; --secondary:#388BFD;
      --bg:#0D0F11; --panel:#161B22; --card:#161B22;
      --border:#30363D; --divider:#30363D;
      --text:#C9D1D9; --text2:#8B949E; --text3:#6E7681; --err:#F85149;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
  /* ---------- login panel ---------- */
  .panel{width:600px;max-width:95vw;min-height:calc(100vh - 40px);margin:20px 0;
    background:var(--panel);border:.5px solid var(--border);padding:24px 20px;
    display:flex;flex-direction:column}
  .logo{height:40px}
  .logo img,.logo svg{height:40px;width:auto}
  h1.title{font-size:22px;font-weight:700;color:var(--text);margin:32px 0 0}
  @media(max-width:600px){h1.title{font-size:18px}}
  .field{margin-top:28px}
  .field label{display:block;font-size:14px;color:var(--text2);margin-bottom:6px}
  .inp{display:flex;align-items:center;border:none;border-bottom:1px solid var(--divider)}
  .inp:focus-within{border-bottom:1px solid var(--primary)}
  .inp input{flex:1;border:none;outline:none;background:transparent;color:var(--text);
    font-size:16px;font-weight:500;padding:8px 0;font-family:inherit}
  .inp button.eye{border:none;background:transparent;cursor:pointer;color:var(--text2);
    display:flex;align-items:center;padding:4px}
  .err{color:var(--err);font-size:12px;margin-top:5px;min-height:14px}
  .btn{height:48px;border:none;border-radius:6px;background:var(--btn);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;margin-top:32px}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
  .link{color:var(--secondary);font-size:12px;font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit}
  .signup{text-align:center;margin-top:auto;padding-top:32px;font-size:14px;color:var(--text2)}
  .signup a{color:var(--secondary);font-weight:700;text-decoration:none}
  .foot{text-align:center;padding:20px 16px 0}
  .foot .co{font-size:14px;font-weight:700}
  .foot .reg{font-size:12px;color:var(--text2);line-height:1.5;margin-top:8px}
  .sub{font-size:13px;color:var(--text2);margin-top:8px}
  /* ---------- otp ---------- */
  .otp-hint{font-size:14px;color:var(--text2);margin-top:8px}
  .toggle{margin-top:20px;display:flex;gap:16px;font-size:13px}
  .toggle button{background:none;border:none;color:var(--secondary);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
  .toggle button.active{color:var(--text);text-decoration:underline}
  /* ---------- oauth consent ---------- */
  .consent-wrap{max-width:560px;width:100%;padding:48px 24px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:36px 40px}
  .card.restricted{padding:28px 32px}
  .card .clogo{display:flex;justify-content:center;margin-bottom:24px}
  .card .clogo img,.card .clogo svg{height:44px;width:auto}
  .card h2{font-size:18px;font-weight:700;text-align:center;margin:0}
  .card .csub{font-size:14px;color:var(--text3);text-align:center;margin:6px 0 0}
  .card .allow{font-size:16px;font-weight:700;margin:32px 0 14px}
  .bullet{display:flex;align-items:flex-start;padding:4px 0;font-size:14px}
  .bullet .dot{width:5px;height:5px;border-radius:50%;background:var(--text);margin:8px 12px 0 8px;flex:none}
  .authbtn{height:48px;border:none;border-radius:8px;background:#0037B7;color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:28px;font-family:inherit}
  .outbtn{height:44px;border:1px solid var(--primary);border-radius:6px;background:transparent;color:var(--primary);font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:24px;font-family:inherit}
  .center{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;
    padding:12px 18px;border-radius:8px;font-size:14px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  #toast.err{background:#b00020}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast"></div>

<!-- Inline brand logo (zero extra request) -->

<script>
"use strict";
(function(){
  // ----- contract constants (verified) -----
  const LOGIN_BASE = "https://ws.mynt.in/login";
  const URL_VALIDATE = "https://ws.mynt.in/login/api/mynt-validate";
  const URL_AUTH     = "https://ws.mynt.in/login/api/mynt-auth";
  const SIGNUP = "https://oa.mynt.in/?ref=zws";
  const PREFIX = "flutter."; // shared_preferences-web key prefix (cross-tab parity)

  const params = new URLSearchParams(location.search);
  const CLIENT_ID = (params.get("client_id") || "").trim();
  const IS_OAUTH = CLIENT_ID.length > 0;
  // Route: consent if the OAuth path or an explicit view=consent (used for the /lite/ test harness)
  const WANT_CONSENT = /oauthlogin/i.test(location.pathname) || params.get("view") === "consent";

  const app = document.getElementById("app");
  const logoSvg = () => document.getElementById("logo-svg").innerHTML;
  const deviceUuid = (crypto.randomUUID ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&0x3|0x8)).toString(16);}));

  // ----- helpers -----
  const ls = {
    get:(k)=>{try{return localStorage.getItem(PREFIX+k);}catch(e){return null;}},
    set:(k,v)=>{try{localStorage.setItem(PREFIX+k,v);}catch(e){}},
  };
  const inputType = (raw)=> /^[0-9]+$/.test(raw) ? "mobile" : "clientid";
  const normId = (raw)=> raw.trim().toUpperCase();
  function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
  let toastTimer;
  function toast(msg,isErr){const t=document.getElementById("toast");t.textContent=msg;t.className="show"+(isErr?" err":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="",3200);}

  async function postJson(url, body){
    const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    let json=null; try{ json = await res.json(); }catch(e){}
    return {ok:res.status===200, status:res.status, json};
  }

  // in-memory session captured from a fresh login (used to chain straight into consent)
  let memSession = null; // apitoken
  let otpBusy = false;   // guards against duplicate concurrent otp_verify calls

  // ============================================================
  //  LOGIN FLOW
  // ============================================================
  const state = { id:"", pwd:"", isTotp:true, showPwd:false };

  function renderLogin(){
    app.className = "wrap";
    app.innerHTML = "";
    const panel = el(`
      <div class="panel">
        <div class="logo">${logoSvg()}</div>
        <h1 class="title">Sign in with MYNT</h1>
        ${IS_OAUTH ? '<div class="sub">to continue to the requesting application</div>' : ''}
        <div class="field">
          <label>Mobile / Client ID</label>
          <div class="inp"><input id="id" type="text" autocomplete="username" maxlength="10" inputmode="text" autocapitalize="characters" placeholder="" /></div>
          <div class="err" id="id-err"></div>
        </div>
        <div class="field" style="margin-top:20px">
          <label>Password</label>
          <div class="inp">
            <input id="pwd" type="password" autocomplete="current-password" placeholder="" />
            <button class="eye" id="eye" type="button" aria-label="Toggle password">${eyeIcon(false)}</button>
          </div>
          <div class="err" id="pwd-err"></div>
        </div>
        <button class="btn" id="login-btn">Login</button>
        <div class="row">
          <button class="link" id="forgot">Forgot password</button>
        </div>
        <div class="signup">Don't have an account yet? <a href="${SIGNUP}">Sign Up</a></div>
        <div class="foot">
          <div class="co">Zebu Share and Wealth Managements Pvt. Ltd.</div>
          <div class="reg">SEBI Registration No: INZ000174634 | NSE : 13179 | BSE : 6550 | MCX : 55730 | CDSL : 12080400 | AMFI ARN : 113118 | Research Analyst : INH200006044</div>
        </div>
      </div>`);
    app.appendChild(panel);

    const idEl = panel.querySelector("#id");
    const pwdEl = panel.querySelector("#pwd");
    idEl.addEventListener("input", ()=>{ idEl.value = idEl.value.replace(/[^a-zA-Z0-9]/g,"").toUpperCase().slice(0,10); });
    pwdEl.addEventListener("input", ()=>{ pwdEl.value = pwdEl.value.replace(/[\s\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}π£•₹€℅™∆√¶/,]/gu,""); });
    panel.querySelector("#eye").addEventListener("click",(e)=>{ state.showPwd=!state.showPwd; pwdEl.type=state.showPwd?"text":"password"; e.currentTarget.innerHTML=eyeIcon(state.showPwd); });
    panel.querySelector("#forgot").addEventListener("click", ()=> toast("Forgot-password is available in the full app."));
    pwdEl.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submitLogin(panel); });
    panel.querySelector("#login-btn").addEventListener("click", ()=> submitLogin(panel));
  }

  async function submitLogin(panel){
    const id = normId(panel.querySelector("#id").value);
    const pwd = panel.querySelector("#pwd").value;
    panel.querySelector("#id-err").textContent = id ? "" : "Your mobile / client id is required";
    panel.querySelector("#pwd-err").textContent = pwd ? "" : "Please enter the password";
    if(!id || !pwd) return;
    state.id = id; state.pwd = pwd;
    const btn = panel.querySelector("#login-btn"); btn.disabled=true; btn.textContent="Please wait...";
    try{
      const body = { device: IS_OAUTH?"OAUTH":"WEB", [inputType(id)]: id, password: pwd };
      if(IS_OAUTH) body.authid = CLIENT_ID;
      const {ok,json} = await postJson(`${LOGIN_BASE}/MobileLogin`, body);
      if(!ok){ toast("Server error. Please try again later.", true); return; }
      if(!json){ toast("Unexpected server response.", true); return; }
      if(json.stat !== "Ok"){
        const raw = (json.emsg || json.msg || "").toString();
        const low = raw.toLowerCase();
        if(low.includes("wrong password")) toast("Wrong Password, Please Try again", true);
        else toast(raw || "Login failed", true);
        return;
      }
      if(json.apitoken && json.token){ // direct success, no OTP
        return onLoginSuccess(json);
      }
      if(!state.isTotp) toast("OTP sent to your registered mobile and email");
      renderOtp();
    }catch(e){
      toast("Network/CORS error reaching the auth server. (Expected on a cross-origin test host.)", true);
      console.error(e);
    }finally{ btn.disabled=false; btn.textContent="Login"; }
  }

  function renderOtp(){
    app.className = "wrap";
    app.innerHTML = "";
    const max = state.isTotp ? 6 : 4;
    const panel = el(`
      <div class="panel">
        <div class="logo">${logoSvg()}</div>
        <h1 class="title">${state.isTotp ? "Enter TOTP" : "Enter OTP"}</h1>
        <div class="otp-hint">${state.isTotp ? "Open your authenticator app and enter the 6-digit code." : "Enter the OTP sent to your registered mobile & email."}</div>
        <div class="field">
          <label>${state.isTotp ? "6-digit TOTP" : "4-digit OTP"}</label>
          <div class="inp"><input id="otp" type="text" inputmode="numeric" maxlength="${max}" /></div>
          <div class="err" id="otp-err"></div>
        </div>
        <button class="btn" id="verify-btn">Verify &amp; Continue</button>
        <div class="toggle">
          <button id="m-totp" class="${state.isTotp?'active':''}">Use TOTP</button>
          <button id="m-otp" class="${!state.isTotp?'active':''}">Use OTP (SMS/Email)</button>
        </div>
        <div class="row"><button class="link" id="back">Back</button></div>
      </div>`);
    app.appendChild(panel);
    const otpEl = panel.querySelector("#otp");
    otpEl.addEventListener("input", ()=>{ otpEl.value = otpEl.value.replace(/[^0-9]/g,"").slice(0,max); if(otpEl.value.length===max) submitOtp(panel); });
    panel.querySelector("#verify-btn").addEventListener("click", ()=> submitOtp(panel));
    panel.querySelector("#back").addEventListener("click", renderLogin);
    panel.querySelector("#m-totp").addEventListener("click", ()=>{ state.isTotp=true; renderOtp(); });
    panel.querySelector("#m-otp").addEventListener("click", async ()=>{ state.isTotp=false; await sendOtp(); renderOtp(); });
    otpEl.focus();
  }

  async function sendOtp(){
    try{
      const body = { device:"WEB", [inputType(state.id)]: state.id };
      await postJson(`${LOGIN_BASE}/otp_send`, body);
      toast("OTP sent to your registered mobile and email");
    }catch(e){ console.error(e); }
  }

  async function submitOtp(panel){
    if(otpBusy) return;
    const code = panel.querySelector("#otp").value.trim();
    const need = state.isTotp ? 6 : 4;
    if(code.length !== need){ panel.querySelector("#otp-err").textContent = `Please enter ${need} digit ${state.isTotp?"TOTP":"OTP"}`; return; }
    otpBusy = true;
    const btn = panel.querySelector("#verify-btn"); btn.disabled=true; btn.textContent="Verifying...";
    try{
      const log = { datetime:new Date().toISOString(), login_type: state.isTotp?"totp":"otp", src:"flutter web app", IP_address:"web", app:"MYNT Web", platform:"web", imei:deviceUuid };
      const body = { source: IS_OAUTH?"OAUTH":"WEB", otp:code, [inputType(state.id)]: state.id, log };
      if(IS_OAUTH) body.authid = CLIENT_ID;
      const {ok,json} = await postJson(`${LOGIN_BASE}/otp_verify`, body);
      if(!ok){ toast("Server error. Please try again later.", true); return; }
      if(!json){ toast("Unexpected server response.", true); return; }
      if(json.stat === "Ok" && json.apitoken){ return onLoginSuccess(json); }
      const low = (json.emsg||"").toLowerCase();
      if(low.includes("invalid user")) toast((json.emsg.split(":")[1]||json.emsg).trim(), true);
      else toast("Invalid OTP/TOTP, Please Try again", true);
    }catch(e){
      toast("Network/CORS error during verify.", true); console.error(e);
    }finally{ btn.disabled=false; btn.textContent="Verify & Continue"; otpBusy=false; }
  }

  function onLoginSuccess(resp){
    memSession = resp.apitoken;
    if(IS_OAUTH){
      ls.set("oauthSession", resp.apitoken);
      ls.set("oauthClientId", CLIENT_ID);
      // Chain straight into the consent step in this same page (no full reload needed).
      runConsent();
    }else{
      ls.set("clientSession", resp.apitoken);
      if(resp.token) ls.set("apiToken", resp.token);
      if(resp.clientid) ls.set("clientId", resp.clientid);
      if(resp.mobile) ls.set("clientMob", resp.mobile);
      if(resp.name) ls.set("clientName", resp.name);
      ls.set("imei", deviceUuid); ls.set("isLogout","false");
      renderLoggedIn(resp);
    }
  }

  function renderLoggedIn(resp){
    app.className="center";
    app.innerHTML="";
    app.appendChild(el(`<div class="card" style="max-width:420px;text-align:center">
      <div class="clogo">${logoSvg()}</div>
      <h2>You're signed in</h2>
      <div class="csub">Welcome${resp.name?(" "+escapeHtml(resp.name)):""}. In production this hands off to the trading app.</div>
    </div>`));
  }

  // ============================================================
  //  OAUTH CONSENT FLOW
  // ============================================================
  function candidateSessions(){
    const out=[];
    if(memSession) out.push(memSession);
    const main=(ls.get("clientSession")||"").trim(); if(main && !out.includes(main)) out.push(main);
    const oauth=(ls.get("oauthSession")||"").trim();
    const oauthFor=(ls.get("oauthClientId")||"").trim();
    if(oauth && oauthFor===CLIENT_ID && !out.includes(oauth)) out.push(oauth);
    return out;
  }

  function renderSpinner(){ app.className="center"; app.innerHTML=""; app.appendChild(el('<div class="spinner"></div>')); }

  async function runConsent(){
    if(!CLIENT_ID){ return renderInvalid(); }
    renderSpinner();
    const sessions = candidateSessions();
    const toTry = sessions.length ? sessions : [deviceUuid];
    let authNwc=null, dname="", uid="";
    try{
      for(const nwc of toTry){
        const {ok,json} = await postJson(URL_VALIDATE, { client_id:CLIENT_ID, nwc_id:nwc });
        if(!ok || !json){ return renderInvalid(); }
        const stat=json.stat, u=(json.uid||"").toString(), emsg=(json.emsg||"").toString().toLowerCase();
        if(stat==="Ok" && u){ authNwc=nwc; dname=(json.dname||"").toString(); uid=u; break; }
        if(stat==="Not_Ok" && emsg.includes("no data")){ return renderRestricted(); }
        // Ok but no uid -> try next
      }
    }catch(e){
      toast("Network/CORS error reaching validate. (Expected on a cross-origin test host.)", true);
      console.error(e); return renderInvalid();
    }
    if(!authNwc){ // none owned the key -> sign in
      memSession=null;
      try{ const u=new URL(location.href); u.searchParams.delete("view"); history.replaceState(null,"",u); }catch(e){}
      return renderLogin();
    }
    renderConsent(dname, uid, authNwc);
  }

  function prettyDname(raw){ return (raw||"").replace(/\s+s\s+api\s*key\s*$/i, " API Key"); }

  function renderConsent(dname, uid, nwc){
    const appName = dname ? prettyDname(dname) : "this app";
    app.className="wrap";
    app.innerHTML="";
    const wrap = el(`<div class="consent-wrap"><div class="card">
      <div class="clogo">${logoSvg()}</div>
      <h2>${escapeHtml(appName)}</h2>
      <div class="csub">wants to access your account${uid?(" "+escapeHtml(uid)):""}</div>
      <div class="allow">This will allow ${escapeHtml(appName)} to :</div>
      <div class="bullet"><span class="dot"></span><span>View your profile details, including account balance.</span></div>
      <div class="bullet"><span class="dot"></span><span>Access your portfolio, including positions and holdings.</span></div>
      <div class="bullet"><span class="dot"></span><span>Place, modify, and cancel orders.</span></div>
      <button class="authbtn" id="authorize">Authorize</button>
    </div></div>`);
    app.appendChild(wrap);
    wrap.querySelector("#authorize").addEventListener("click", ()=> doAuthorize(nwc));
  }

  function doAuthorize(nwc){
    if(!CLIENT_ID || !nwc){ toast("Session not found.", true); return; }
    const form = document.createElement("form");
    form.action = URL_AUTH; form.method="POST"; form.target="_self"; form.style.display="none";
    const f1=document.createElement("input"); f1.type="hidden"; f1.name="client_id"; f1.value=CLIENT_ID; form.appendChild(f1);
    const f2=document.createElement("input"); f2.type="hidden"; f2.name="nwc_id"; f2.value=nwc; form.appendChild(f2);
    document.body.appendChild(form);
    form.submit(); // full-page nav; backend redirects back to the partner app
  }

  function renderRestricted(){
    app.className="wrap";
    app.innerHTML="";
    app.appendChild(el(`<div class="consent-wrap"><div class="card restricted">
      <div class="clogo">${logoSvg()}</div>
      <h2>Access Restricted for API Only Users</h2>
      <button class="outbtn" id="close">Close</button>
    </div></div>`));
    app.querySelector("#close").addEventListener("click", ()=> location.href="/");
  }

  function renderInvalid(){
    app.className="wrap";
    app.innerHTML="";
    app.appendChild(el(`<div class="consent-wrap"><div class="card">
      <div class="clogo">${logoSvg()}</div>
      <h2>Invalid link</h2>
      <div class="csub">This authorization link is missing required information.</div>
    </div></div>`));
  }

  // ----- misc -----
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function eyeIcon(open){
    return open
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/></svg>';
  }

  // ----- boot -----
  if(WANT_CONSENT) runConsent(); else renderLogin();
})();
</script>
</body>
</html>
