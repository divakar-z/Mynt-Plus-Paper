<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Sign in with MYNT" />
<title>Sign in with MYNT</title>
<link rel="icon" href="/favicon.png" />
<style>
  /* Geist, async (font-display:swap) so paint never blocks on fonts */
  @font-face{font-family:'Geist';font-weight:400;font-display:swap;src:url('/assets/fonts/Geist/Geist-Regular.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:500;font-display:swap;src:url('/assets/fonts/Geist/Geist-Medium.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:600;font-display:swap;src:url('/assets/fonts/Geist/Geist-SemiBold.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:700;font-display:swap;src:url('/assets/fonts/Geist/Geist-Bold.ttf') format('truetype')}

  :root{
    --fs:1;
    --primary:#0037B7; --secondary:#0052CC; --btn:#0037B7; --focus:#0037B7;
    --bg:#FFFFFF; --panel:#FFFFFF; --inner:#FFFFFF; --inner-border:#E0E0E0;
    --divider:#DDE2E7; --text:#121212; --text2:#4A4A4A; --loss:#FF1717; --white:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){:root{
    --primary:#58A6FF; --secondary:#388BFD; --btn:#0052CC; --focus:#58A6FF;
    --bg:#0D0F11; --panel:#161B22; --inner:#0D0F11; --inner-border:#30363D;
    --divider:#30363D; --text:#C9D1D9; --text2:#8B949E; --loss:#F85149; --white:#FFFFFF;
  }}
  :root[data-theme=dark]{
    --primary:#58A6FF; --secondary:#388BFD; --btn:#0052CC; --focus:#58A6FF;
    --bg:#0D0F11; --panel:#161B22; --inner:#0D0F11; --inner-border:#30363D;
    --divider:#30363D; --text:#C9D1D9; --text2:#8B949E; --loss:#F85149; --white:#FFFFFF;
  }
  :root[data-theme=light]{
    --primary:#0037B7; --secondary:#0052CC; --btn:#0037B7; --focus:#0037B7;
    --bg:#FFFFFF; --panel:#FFFFFF; --inner:#FFFFFF; --inner-border:#E0E0E0;
    --divider:#DDE2E7; --text:#121212; --text2:#4A4A4A; --loss:#FF1717; --white:#FFFFFF;
  }
  /* fontScaleFactor: <1000 -> .8, 1000-1299 -> .9, >=1300 -> 1.0 */
  @media (max-width:1299px){:root{--fs:.9}}
  @media (max-width:999px){:root{--fs:.8}}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}

  .wrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
  .panel{position:relative;width:min(600px,95vw);min-height:calc(100vh - 40px);margin:20px auto;background:var(--panel);display:flex;flex-direction:column}
  .inner{position:relative;flex:1;min-height:calc(100vh - 40px);padding:20px;background:var(--inner);border:.5px solid var(--inner-border);display:flex;flex-direction:column}
  .logo{height:calc(40px*var(--fs))}.logo svg{height:100%;width:auto;display:block}
  .h-title{font-size:calc(22px*var(--fs));font-weight:700;color:var(--text);margin:24px 0 0}
  @media(max-width:600px){.h-title{font-size:calc(18px*var(--fs))}}
  .spacer{height:140px}

  .field{margin-top:28px}
  .field .lbl{display:block;color:var(--text2);font-size:calc(14px*var(--fs));margin-bottom:4px}
  .inp{display:flex;align-items:center;border-bottom:1px solid var(--divider)}
  .inp:focus-within{border-bottom:1px solid var(--focus)}
  .inp input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:calc(16px*var(--fs));font-weight:500;padding:8px 0;font-family:inherit}
  .inp .suffix{display:flex;align-items:center;color:var(--text2);font-size:calc(10px*var(--fs));text-align:right;white-space:nowrap}
  .inp button.icobtn{border:none;background:transparent;cursor:pointer;color:var(--text2);display:flex;align-items:center;padding:6px}
  .inp .resend{cursor:pointer;color:var(--secondary);font-weight:700;font-size:calc(10px*var(--fs))}
  .inp .resend.disabled{cursor:default;color:var(--text2);font-weight:500;line-height:1.3;text-align:right}
  .err{color:var(--loss);font-size:calc(12px*var(--fs));font-weight:500;margin-top:5px;min-height:14px}

  .btn{height:48px;border:none;border-radius:6px;background:var(--btn);color:var(--white);font-size:calc(16px*var(--fs));font-weight:700;cursor:pointer;width:100%;font-family:inherit;margin-top:32px;display:flex;align-items:center;justify-content:center}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
  .link{color:var(--secondary);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;font-size:calc(12px*var(--fs));display:inline-flex;align-items:center;gap:4px}
  .link.body{font-size:calc(14px*var(--fs))}
  .signup{text-align:center;margin-top:auto;padding-top:64px;font-size:calc(14px*var(--fs));color:var(--text)}
  .signup a{color:var(--secondary);font-weight:700;text-decoration:none}
  .foot{position:absolute;left:0;right:0;bottom:0;padding:20px 0;text-align:center}
  .foot .co{font-size:calc(14px*var(--fs));font-weight:700;color:var(--text)}
  .foot .reg{font-size:calc(12px*var(--fs));font-weight:500;color:var(--text2);line-height:1.5;margin:8px 16px 0}

  .idcap .c1{font-size:calc(10px*var(--fs));color:var(--text2)}
  .idcap .c2{font-size:calc(16px*var(--fs));font-weight:500;color:var(--text)}
  .idcap .change{font-size:calc(14px*var(--fs));font-weight:600;color:var(--secondary);cursor:pointer}
  .divider{height:1px;background:var(--divider);margin:12px 0}

  .saved{display:flex;flex-direction:column;align-items:center;margin-top:8px}
  .avatar{width:100px;height:100px;border-radius:50%;background:var(--bg);border:1.5px solid var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:calc(20px*var(--fs));font-weight:700}
  .saved .nm{font-size:calc(18px*var(--fs));font-weight:700;color:var(--text);margin-top:16px}
  .saved .cid{font-size:calc(16px*var(--fs));font-weight:600;color:var(--text);margin-top:6px}

  .consent-wrap{max-width:560px;width:100%;padding:48px 24px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--inner-border);border-radius:5px;padding:36px 40px}
  .card.restricted{padding:28px 32px}
  .card .clogo{display:flex;justify-content:center;margin-bottom:24px}.card .clogo svg{height:44px;width:auto}
  .card h2{font-size:calc(18px*var(--fs));font-weight:700;text-align:center;margin:0;color:var(--text)}
  .card .csub{font-size:calc(14px*var(--fs));color:var(--text2);text-align:center;margin:6px 0 0}
  .card .allow{font-size:calc(16px*var(--fs));font-weight:700;margin:32px 0 14px;color:var(--text)}
  .bullet{display:flex;align-items:flex-start;padding:4px 0;font-size:calc(14px*var(--fs));color:var(--text)}
  .bullet .dot{width:5px;height:5px;border-radius:50%;background:var(--text);margin:8px 12px 0 8px;flex:none}
  .authbtn{height:48px;border:none;border-radius:8px;background:#0037B7;color:#fff;font-size:calc(16px*var(--fs));font-weight:700;cursor:pointer;width:100%;margin-top:28px;font-family:inherit}
  .outbtn{height:44px;border:1px solid var(--primary);border-radius:6px;background:transparent;color:var(--primary);font-size:calc(16px*var(--fs));font-weight:600;cursor:pointer;width:100%;margin-top:24px;font-family:inherit}

  .qrbox{width:295px;height:295px;margin:16px auto;display:flex;align-items:center;justify-content:center;position:relative}
  .qrbox img{width:295px;height:295px;background:#fff}
  .qr-expired{width:96px;height:96px;border-radius:50%;border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:40px}
  .qr-cap{text-align:center;color:var(--text2);font-size:calc(14px*var(--fs))}
  .qr-exp{text-align:center;color:var(--text);font-weight:600;font-size:calc(14px*var(--fs));margin-top:8px}

  .center{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .spinner{width:34px;height:34px;border:4px solid var(--divider);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  .spinner.sm{width:20px;height:20px;border-width:3px;border-top-color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}

  #toasts{position:fixed;top:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:1000;max-width:360px}
  .toast{padding:12px 16px;border-radius:8px;color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .toast .tt{font-weight:700;margin-bottom:2px}
  .toast.success{background:#4CAF50}.toast.error{background:#EF5350}.toast.warning{background:#FF9800}.toast.info{background:#2196F3}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toasts"></div>

<script>
"use strict";
(function(){
  const LOGIN_BASE="https://ws.mynt.in/login";
  const URL_VALIDATE="https://ws.mynt.in/login/api/mynt-validate";
  const URL_AUTH="https://ws.mynt.in/login/api/mynt-auth";
  const CHANGE_PW_URL="https://go.mynt.in/NorenWClientWeb/Changepwd";
  const QR_IMG="https://ws.mynt.in/login/get_login_qr";
  const SIGNUP="https://oa.mynt.in/?ref=zws";
  const PREFIX="flutter.";

  const params=new URLSearchParams(location.search);
  const CLIENT_ID=(params.get("client_id")||"").trim();
  const IS_OAUTH=CLIENT_ID.length>0;
  const WANT_CONSENT=/oauthlogin/i.test(location.pathname)||params.get("view")==="consent";

  const app=document.getElementById("app");
  const logoSvg=()=>document.getElementById("logo-svg").innerHTML;
  const uuid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&0x3|0x8)).toString(16);});
  const deviceUuid=uuid();

  // shared_preferences-web stores String values JSON-encoded (e.g. "ZP00231" with
  // quotes) and bools unquoted (true/false). MUST match that encoding or Flutter's
  // pref.init() throws decoding our values and the app crashes before runApp.
  const ls={
    get:k=>{try{const v=localStorage.getItem(PREFIX+k); if(v===null)return null; try{return JSON.parse(v);}catch(e){return v;}}catch(e){return null;}},
    set:(k,v)=>{try{localStorage.setItem(PREFIX+k,JSON.stringify(v));}catch(e){}}
  };
  const inputType=raw=>/^[0-9]+$/.test(raw)?"mobile":"clientid";
  const upper=raw=>raw.trim().toUpperCase();
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
  function fmtTime(s){const m=String(Math.floor(s/60)).padStart(2,"0");const ss=String(s%60).padStart(2,"0");return m+" : "+ss;}
  async function sha256hex(str){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}

  function toast(type,msg){
    const box=document.getElementById("toasts");
    const tt={success:"Success",error:"Error",warning:"Warning",info:"Info"}[type]||"Info";
    const node=el(`<div class="toast ${type}"><div class="tt">${tt}</div><div>${escapeHtml(msg)}</div></div>`);
    box.appendChild(node); while(box.children.length>3) box.removeChild(box.firstChild);
    setTimeout(()=>{if(node.parentNode)node.parentNode.removeChild(node);}, type==="warning"||type==="info"?3000:4000);
  }
  const showSuccess=m=>toast("success",m), showError=m=>toast("error",m), showWarning=m=>toast("warning",m);

  async function postJson(url,body){
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let json=null; try{json=await res.json();}catch(e){}
    return {ok:res.status===200,status:res.status,json};
  }

  function prefetchFlutter(){
    // Intentionally a NO-OP. Manually prefetching Flutter's main.dart.js / canvaskit
    // from this page raced Flutter's own asset load after the redirect and crashed
    // the engine (white-screen hang) — both an as="script" prefetch of main.dart.js
    // and a CORS-mode prefetch of canvaskit.wasm reproduced it. The Flutter service
    // worker (registered by flutter_bootstrap.js) already precaches these assets
    // after the first Flutter load, so returning users get a warm app WITHOUT this
    // hazard. A safe pre-warm would need Speculation Rules or a prefetch guaranteed
    // to finish before navigation — deferred to a later pass.
  }

  const S={ id:"", pwd:"", isTotp:true, topflow:false, showPwd:false,
            resend:0, resendTimer:null, otpBusy:false, loginBusy:false,
            fId:"", fResend:0, fHandle:null,
            isExpired:false, generatedFlow:false, oldPw:"", showOld:false, showNew:false,
            qrUuid:"", qrPoll:null, qrCountdown:null, qrStart:89, qrRefresh:0, qrExpired:false };
  let memSession=null;

  function panel(innerHtml, withFooter){
    app.className="wrap"; app.innerHTML="";
    const p=el(`<div class="panel"><div class="inner">
      <div class="logo">${logoSvg()}</div>
      ${innerHtml}
      ${withFooter?`<div class="foot">
        <div class="co">Zebu Share and Wealth Managements Pvt. Ltd.</div>
        <div class="reg">SEBI Registration No: INZ000174634 | NSE : 13179 | BSE : 6550 | MCX : 55730 | CDSL : 12080400 | AMFI ARN : 113118 | Research Analyst : INH200006044</div>
      </div>`:``}
    </div></div>`);
    app.appendChild(p);
    return p.querySelector(".inner");
  }
  function eyeIcon(open){
    return open
      ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
      :'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/></svg>';
  }
  const qrIco='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm0 4h3v4h-2v-2h-1v-2zm-5-4h2v3h-2v-3zm0 5h2v3h-2v-3z"/></svg>';
  const sanId=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);
  const sanPwd=v=>v.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").replace(/[π£•₹€℅™∆√¶/,]/g,"").replace(/\s/g,"");

  // ---------- LOGIN ----------
  function savedAccount(){

    if(isLogout && (cid||mob)) return {cid, name:(ls.get("clientName")||"").trim()};
    return null;
  }

      ${saved?`<div class="saved">
        <div class="avatar">${saved.name?escapeHtml(saved.name.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("")):""}</div>
        <div class="nm">${escapeHtml(saved.name)}</div>
        <div class="cid">${escapeHtml(saved.cid)}</div>

      <div class="field"><span class="lbl">Mobile / Client ID</span>

      </div>`}

    `, true);

    if(!saved){ const idEl=inner.querySelector("#id"); idEl.addEventListener("input",()=>{idEl.value=sanId(idEl.value);}); }
    const pwdEl=inner.querySelector("#pwd");
    pwdEl.addEventListener("input",()=>{pwdEl.value=sanPwd(pwdEl.value);});
    inner.querySelector("#eye").addEventListener("click",e=>{S.showPwd=!S.showPwd;pwdEl.type=S.showPwd?"text":"password";e.currentTarget.innerHTML=eyeIcon(S.showPwd);});

    });

  async function submitLogin(inner){
    if(S.loginBusy) return;
    const id=savedAccount()?upper(S.id):upper(inner.querySelector("#id").value);
    const pwd=inner.querySelector("#pwd").value;
    const idErr=inner.querySelector("#id-err"); if(idErr) idErr.textContent=id?"":"Your mobile / client id is required";
    inner.querySelector("#pwd-err").textContent=pwd?"":"Please enter the password";
    if(!id||!pwd) return;
    S.id=id; S.pwd=pwd; S.loginBusy=true;
    const btn=inner.querySelector("#login-btn"); btn.disabled=true; btn.innerHTML='<div class="spinner sm"></div>';
    try{
      const body={device:IS_OAUTH?"OAUTH":"WEB",[inputType(id)]:id,password:pwd};
      if(IS_OAUTH) body.authid=CLIENT_ID;
      const {ok,json}=await postJson(`${LOGIN_BASE}/MobileLogin`,body);
      if(!ok){ showError("Server error. Please try again later."); return; }
      if(!json){ showError("An error occurred. Please try again."); return; }
      if(json.stat==="Ok"){
        // NOTE: do not write any flutter.* prefs on the normal path — the URL
        // auto-login handoff lets Flutter create the session itself. imei is
        // already sent directly in the otp_verify log below.
        if(json.apitoken&&json.token){ return onLoginSuccess(json); }
        S.isTotp=true; S.topflow=false; renderOtp(); return;
      }
      const emsg=(json.emsg||"").toString(), msg=(json.msg||"").toString();
      const low=(emsg+" "+msg).toLowerCase();
      if(low.includes("wrong password")){ showError("Wrong Password, Please Try again"); return; }
      if(low.includes("user blocked")||low.includes("multiple wrong attempts")){ showError(emsg||msg||"User blocked"); S.fId=id; setTimeout(()=>renderForgot1(),3000); return; }
      if(low.includes("change password")||low.includes("password expired")){ showError(emsg||msg||"Change password"); S.id=(json.clientid||id); S.isExpired=low.includes("password expired"); S.generatedFlow=false; if(S.isExpired)S.oldPw=pwd; renderChangePw(); return; }
      showWarning(emsg||msg||"Login failed. Please check your credentials.");
    }catch(e){ showWarning("Login failed. Please try again."); console.error(e); }
    finally{ S.loginBusy=false; const b=document.getElementById("login-btn"); if(b){b.disabled=false;b.textContent="Login";} }
  }

  // ---------- OTP / TOTP ----------
  function startResendTimer(){ clearInterval(S.resendTimer); S.resend=89; paintResend(); S.resendTimer=setInterval(()=>{S.resend--; if(S.resend<=0)clearInterval(S.resendTimer); paintResend();},1000); }
  function paintResend(){
    const sfx=document.getElementById("otp-suffix"); if(!sfx) return;
    if(S.isTotp){ sfx.innerHTML=`<span class="resend" id="setup-totp">Set up TOTP</span>`; sfx.querySelector("#setup-totp").onclick=startTotpSetup; return; }
    if(S.resend>0){ sfx.innerHTML=`<span class="resend disabled">Resend<br>in ${fmtTime(S.resend)}</span>`; }
    else { sfx.innerHTML=`<span class="resend" id="resend">${S.topflow?"Resend Setup OTP":"Resend OTP"}</span>`; sfx.querySelector("#resend").onclick=resendOtp; }
  }
  function renderOtp(){
    const len=S.isTotp?6:4;
    const heading=S.isTotp?"Enter the 6-digit TOTP":(S.topflow?"Enter OTP to set up TOTP":"Enter the 4-digit OTP");
    const lbl=S.topflow?"Enter the 4-digit OTP to complete TOTP setup":`Enter ${S.isTotp?6:4} digit ${S.isTotp?"TOTP":"OTP"}`;
    const inner=panel(`
      <h1 class="h-title">${heading}</h1>
      <div class="idcap" style="margin-top:24px">
        <div class="c1">Mobile / Client ID</div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="c2">${escapeHtml(S.id)}</span><span class="change" id="change-id">Change</span></div>
        <div class="divider"></div>
      </div>
      <div class="field" style="margin-top:8px"><span class="lbl">${lbl}</span>
        <div class="inp"><input id="otp" type="text" inputmode="numeric" maxlength="${len}" autofocus/><span class="suffix" id="otp-suffix"></span></div>
        <div class="err" id="otp-err"></div>
      </div>
      <button class="btn" id="verify-btn">Verify</button>
      <div class="row">
        <button class="link body" id="toggle-mode">${S.isTotp?"Enter OTP":"Enter TOTP"}</button>
        <button class="link body" id="scan-qr">Scan QR ${qrIco}</button>
      </div>
      <div class="spacer"></div>
    `, true);
    const otpEl=inner.querySelector("#otp");
    otpEl.addEventListener("input",()=>{otpEl.value=otpEl.value.replace(/[^0-9]/g,"").slice(0,len); inner.querySelector("#otp-err").textContent=""; if(otpEl.value.length===len) submitOtp(inner);});
    inner.querySelector("#verify-btn").addEventListener("click",()=>submitOtp(inner));
    inner.querySelector("#change-id").addEventListener("click",()=>{clearInterval(S.resendTimer);S.resendTimer=null;renderLogin();});
    inner.querySelector("#scan-qr").addEventListener("click",startQr);
    inner.querySelector("#toggle-mode").addEventListener("click",toggleMode);
    paintResend(); otpEl.focus();
  }
  async function toggleMode(){
    S.isTotp=!S.isTotp; S.topflow=false;
    if(!S.isTotp){ const okk=await sendOtp(false); renderOtp(); if(okk) startResendTimer(); }
    else { clearInterval(S.resendTimer); S.resendTimer=null; renderOtp(); }
  }
  async function sendOtp(isTotpSetup){
    try{
      const body={device:"WEB",[inputType(S.id)]:S.id}; if(isTotpSetup) body.is_totp=true;
      const {json}=await postJson(`${LOGIN_BASE}/otp_send`,body);
      if(json && (json.stat==="Ok" || (json.msg||"").toLowerCase().includes("otp"))){ showSuccess(isTotpSetup?"4-digit TOTP Setup code sent successfully":"OTP sent successfully"); return true; }
      if(json && json.emsg) showWarning(json.emsg);
      return false;
    }catch(e){ showWarning("Failed to send OTP"); return false; }
  }
  async function resendOtp(){ const okk=await sendOtp(S.topflow); if(okk) startResendTimer(); }
  async function submitOtp(inner){
    if(S.otpBusy) return;
    const code=inner.querySelector("#otp").value.trim(); const len=S.isTotp?6:4;
    if(code.length!==len){ inner.querySelector("#otp-err").textContent=`Please enter ${len} digit ${S.isTotp?"TOTP":"OTP"}`; return; }
    S.otpBusy=true; const btn=inner.querySelector("#verify-btn"); btn.disabled=true; btn.innerHTML='<div class="spinner sm"></div>';
    try{
      const log={datetime:new Date().toISOString(),login_type:S.isTotp?"totp":"otp",src:"flutter web app",IP_address:"web",app:"MYNT Web",platform:"web",imei:deviceUuid};
      const body={source:IS_OAUTH?"OAUTH":"WEB",otp:code,[inputType(S.id)]:S.id,log}; if(IS_OAUTH) body.authid=CLIENT_ID;
      const {ok,json}=await postJson(`${LOGIN_BASE}/otp_verify`,body);
      if(!ok){ showError("Server error. Please try again later."); return; }
      if(!json){ showError("OTP verification failed. Please try again."); return; }
      if(json.stat==="Ok"&&json.apitoken){ clearInterval(S.resendTimer); return onLoginSuccess(json); }
      const e=(json.emsg||"").toLowerCase(); const otpLabel=S.isTotp?"TOTP":"OTP";
      if(e.includes("change password")||e.includes("password expired")){ S.id=(json.clientid||S.id); S.isExpired=e.includes("password expired"); S.generatedFlow=false; if(S.isExpired)S.oldPw=S.pwd; showWarning(json.emsg); clearInterval(S.resendTimer); renderChangePw(); return; }
      if(e.includes("invalid user")){ showError((json.emsg.split(":").pop()||json.emsg).trim()); return; }
      if(e.includes("otp not valid")||e.includes("invalid otp")||e.includes("invalid input")){ showError(`Invalid ${otpLabel}, Please Try again`); return; }
      showError(json.emsg||`Invalid ${otpLabel}, Please Try again`);
    }catch(e){ showWarning("Verification failed. Please try again."); console.error(e); }
    finally{ S.otpBusy=false; const b=document.getElementById("verify-btn"); if(b){b.disabled=false;b.textContent="Verify";} }
  }
  function startTotpSetup(){ S.topflow=true; S.isTotp=false; renderOtp(); sendOtp(true).then(okk=>{ if(okk) startResendTimer(); }); }

  function renderForgot2(){
    const inner=panel(`
      <h1 class="h-title">Enter the 4-digit OTP</h1>
      <div class="field"><span class="lbl">Enter the 4-digit OTP</span>
        <div class="inp"><input id="fotp" type="text" inputmode="numeric" maxlength="4" autofocus/><span class="suffix" id="fotp-suffix"></span></div>

    function fpaint(){
      const sfx=document.getElementById("fotp-suffix"); if(!sfx) return;

      else{ sfx.innerHTML=`<span class="resend" id="fresend">Resend OTP</span>`; sfx.querySelector("#fresend").onclick=async()=>{ const {json}=await postJson(`${LOGIN_BASE}/ForgetPasswordOtpSend`,{field:inputType(S.fId),value:S.fId}); if(json&&json.msg==="otp sended"){ showSuccess("OTP sent to your registered mobile/email"); fStartResend(); } }; }

  // ---------- CHANGE PASSWORD ----------
  function validateNewPw(v){
    v=v.replace(/\s/g,""); if(!v) return "Please enter the new password";
    const miss=[]; if(!/[A-Z]/.test(v))miss.push("an uppercase letter"); if(!/[a-z]/.test(v))miss.push("a lowercase letter");
    if(!/[0-9]/.test(v))miss.push("a number"); if(!/[#$\-*@]/.test(v))miss.push("a special character (#, $, -, *, @)");
    if(v.length<7)miss.push("at least 7 characters");
    return miss.length?("Please enter "+miss.join(", ")):"";
  }
  function renderChangePw(){
    const oldLbl=S.isExpired?"Old Password":"Generated Password";
    const inner=panel(`
      <h1 class="h-title">Change Your Password</h1>
      <div class="field"><span class="lbl">${oldLbl}</span>
        <div class="inp"><input id="oldpw" type="password"/><button class="icobtn" id="eye-old" type="button">${eyeIcon(false)}</button></div>
        <div class="err" id="old-err"></div>
      </div>
      <div class="field" style="margin-top:20px"><span class="lbl">New Password</span>
        <div class="inp"><input id="newpw" type="password"/><button class="icobtn" id="eye-new" type="button">${eyeIcon(false)}</button></div>
        <div class="err" id="new-err"></div>
      </div>
      <button class="btn" id="setpw-btn">Set New Password</button>
      <div class="row"><button class="link" id="back">Back to login</button></div>
      <div class="spacer"></div>
    `, true);
    const oldEl=inner.querySelector("#oldpw"), newEl=inner.querySelector("#newpw");
    if(S.oldPw) oldEl.value=S.oldPw;
    newEl.addEventListener("input",()=>{ let v=newEl.value.replace(/[^A-Za-z0-9#$\-*@]/g,""); if(v.length>12){v=v.slice(0,12); const ne=inner.querySelector("#new-err"); ne.textContent="Password must be exactly 12 characters"; setTimeout(()=>{if(ne.textContent==="Password must be exactly 12 characters")ne.textContent="";},2000);} newEl.value=v; });
    inner.querySelector("#eye-old").addEventListener("click",e=>{S.showOld=!S.showOld;oldEl.type=S.showOld?"text":"password";e.currentTarget.innerHTML=eyeIcon(S.showOld);});
    inner.querySelector("#eye-new").addEventListener("click",e=>{S.showNew=!S.showNew;newEl.type=S.showNew?"text":"password";e.currentTarget.innerHTML=eyeIcon(S.showNew);});
    inner.querySelector("#back").addEventListener("click",()=>{S.id=S.id||S.fId;renderLogin();});
    inner.querySelector("#setpw-btn").addEventListener("click",async()=>{
      const oldv=oldEl.value.replace(/\s/g,""), newv=newEl.value.replace(/\s/g,"");
      inner.querySelector("#old-err").textContent=oldv?"":(S.isExpired?"Please enter the Old Password":"Please enter the Generated Password");
      const ne=validateNewPw(newv); inner.querySelector("#new-err").textContent=ne;
      if(!oldv||ne) return;
      const btn=inner.querySelector("#setpw-btn"); btn.disabled=true; btn.innerHTML='<div class="spinner sm"></div>';
      try{
        const oldHash=await sha256hex(oldv);
        const jData=JSON.stringify({uid:upper(S.id),oldpwd:oldHash,pwd:newv});
        const res=await fetch(CHANGE_PW_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:"jData="+jData});
        let json=null; try{json=await res.json();}catch(e){}
        if(json && json.stat==="Ok"){ const dmsg=(json.dmsg||"Password changed successfully").replace(/password change success/i,"Password changed successfully"); showSuccess(dmsg); S.pwd=""; renderLogin(); return; }
        if(json && json.emsg){ let raw=json.emsg.replace(/Error Occurred :/i,"").trim(); if(/previous 3 passwords|last 3 passwords/i.test(raw)) raw="New password cannot match your last 3 passwords"; else if(S.generatedFlow) raw=raw.replace(/old password/ig,"Generated Password"); showError(raw); }
        else showError("Failed to change password. Please try again.");
      }catch(e){ showError("An error occurred. Please try again."); console.error(e); }
      finally{ const b=document.getElementById("setpw-btn"); if(b){b.disabled=false;b.textContent="Set New Password";} }
    });
  }

  // ---------- QR LOGIN ----------
  function stopQr(){ clearInterval(S.qrPoll); clearInterval(S.qrCountdown); S.qrPoll=null; S.qrCountdown=null; }
  function startQr(){ stopQr(); S.qrRefresh=0; S.qrExpired=false; beginQrSession(); renderQr(); }
  function beginQrSession(){ S.qrUuid=uuid(); ls.set("pendingQrUuid",S.qrUuid); S.qrExpired=false; S.qrPoll=setInterval(pollQr,2000); }
  function renderQr(){
    const inner=panel(`
      <h1 class="h-title">Scan QR to login</h1>
      <div class="qrbox">${S.qrExpired?`<div class="qr-expired" id="qr-refresh">&#x21bb;</div>`:`<img id="qrimg" src="${QR_IMG}?unique_id=${S.qrUuid}&source=WEB" alt="QR"/>`}</div>
      <div class="qr-cap">${S.qrExpired?"Click to refresh QR code":"Scan QR code from profile tab top appbar of MYNT to login."}</div>
      <div class="qr-exp" id="qr-exp"></div>
      <div class="row" style="justify-content:flex-end"><button class="link" id="back">Back to login</button></div>
      <div class="spacer"></div>
    `, true);
    inner.querySelector("#back").addEventListener("click",()=>{stopQr();renderLogin();});
    if(S.qrExpired){ inner.querySelector("#qr-refresh").addEventListener("click",startQr); return; }
    const img=inner.querySelector("#qrimg"); img.addEventListener("load",()=>{ if(!S.qrCountdown) startQrCountdown(); });
  }
  function startQrCountdown(){
    S.qrStart=89; const exp=document.getElementById("qr-exp"); if(exp) exp.textContent="QR expires in "+fmtTime(S.qrStart);
    S.qrCountdown=setInterval(()=>{ S.qrStart--; const e=document.getElementById("qr-exp"); if(e) e.textContent="QR expires in "+fmtTime(S.qrStart);
      if(S.qrStart<=1){ clearInterval(S.qrCountdown); S.qrCountdown=null; if(S.qrRefresh<2){ S.qrRefresh++; clearInterval(S.qrPoll); beginQrSession(); renderQr(); } else { stopQr(); S.qrExpired=true; renderQr(); } }
    },1000);
  }
  async function pollQr(){ try{ const {json}=await postJson(`${LOGIN_BASE}/QRlogin`,{unique_id:S.qrUuid,source:"WEB",imei:S.qrUuid}); if(json && json.stat==="Ok" && json.apitoken){ stopQr(); onLoginSuccess(json); } }catch(e){} }

  // ---------- SUCCESS / HANDOFF ----------
  function onLoginSuccess(resp){
    if(IS_OAUTH){ memSession=resp.apitoken; ls.set("oauthSession",resp.apitoken); ls.set("oauthClientId",CLIENT_ID); runConsent(); return; }
    const cid=(resp.clientid||S.id||"").toString().trim(); const token=(resp.apitoken||"").toString().trim();
    if(!cid||!token){ showError("Signed in, but the session data was incomplete. Please try again."); return; }
    location.replace("/?uid="+encodeURIComponent(cid)+"&token="+encodeURIComponent(token));
  }

  // ---------- OAUTH CONSENT ----------
  function candidateSessions(){
    const out=[]; if(memSession) out.push(memSession);
    const main=(ls.get("clientSession")||"").trim(); if(main&&!out.includes(main)) out.push(main);
    const oauth=(ls.get("oauthSession")||"").trim(); const oauthFor=(ls.get("oauthClientId")||"").trim();
    if(oauth&&oauthFor===CLIENT_ID&&!out.includes(oauth)) out.push(oauth);
    return out;
  }
  function spinner(){ app.className="center"; app.innerHTML=""; app.appendChild(el('<div class="spinner"></div>')); }
  async function runConsent(){
    if(!CLIENT_ID) return renderInvalid();
    spinner();
    const sessions=candidateSessions(); const toTry=sessions.length?sessions:[deviceUuid];
    let authNwc=null,dname="",uid="";
    try{
      for(const nwc of toTry){
        const {ok,json}=await postJson(URL_VALIDATE,{client_id:CLIENT_ID,nwc_id:nwc});
        if(!ok||!json) return renderInvalid();
        const stat=json.stat,u=(json.uid||"").toString(),emsg=(json.emsg||"").toString().toLowerCase();
        if(stat==="Ok"&&u){ authNwc=nwc; dname=(json.dname||"").toString(); uid=u; break; }
        if(stat==="Not_Ok"&&emsg.includes("no data")) return renderRestricted();
      }
    }catch(e){ showError("Network error reaching validate."); return renderInvalid(); }
    if(!authNwc){ memSession=null; return renderLogin(); }
    renderConsent(dname,uid,authNwc);
  }
  const prettyDname=raw=>(raw||"").replace(/\s+s\s+api\s*key\s*$/i," API Key");
  function renderConsent(dname,uid,nwc){
    const appName=dname?prettyDname(dname):"this app";
    app.className="wrap"; app.innerHTML="";
    const wrap=el(`<div class="consent-wrap"><div class="card">
      <div class="clogo">${logoSvg()}</div>
      <h2>${escapeHtml(appName)}</h2>
      <div class="csub">wants to access your account${uid?(" "+escapeHtml(uid)):""}</div>
      <div class="allow">This will allow ${escapeHtml(appName)} to :</div>
      <div class="bullet"><span class="dot"></span><span>View your profile details, including account balance.</span></div>
      <div class="bullet"><span class="dot"></span><span>Access your portfolio, including positions and holdings.</span></div>
      <div class="bullet"><span class="dot"></span><span>Place, modify, and cancel orders.</span></div>
      <button class="authbtn" id="authorize">Authorize</button>
    </div></div>`);
    app.appendChild(wrap);
    wrap.querySelector("#authorize").addEventListener("click",()=>doAuthorize(nwc));
  }
  function doAuthorize(nwc){
    if(!CLIENT_ID||!nwc){ showError("Session not found."); return; }
    const form=document.createElement("form"); form.action=URL_AUTH; form.method="POST"; form.target="_self"; form.style.display="none";
    const f1=document.createElement("input"); f1.type="hidden"; f1.name="client_id"; f1.value=CLIENT_ID; form.appendChild(f1);
    const f2=document.createElement("input"); f2.type="hidden"; f2.name="nwc_id"; f2.value=nwc; form.appendChild(f2);
    document.body.appendChild(form); form.submit();
  }
  function renderRestricted(){
    app.className="wrap"; app.innerHTML="";
    app.appendChild(el(`<div class="consent-wrap"><div class="card restricted"><div class="clogo">${logoSvg()}</div><h2>Access Restricted for API Only Users</h2><button class="outbtn" id="close">Close</button></div></div>`));
    app.querySelector("#close").addEventListener("click",()=>location.href="/");
  }
  function renderInvalid(){
    app.className="wrap"; app.innerHTML="";
    app.appendChild(el(`<div class="consent-wrap"><div class="card"><div class="clogo">${logoSvg()}</div><h2>Invalid link</h2><div class="csub">This authorization link is missing required information.</div></div></div>`));
  }

  // ---- boot ----
  prefetchFlutter();
  if(WANT_CONSENT) runConsent(); else renderLogin();
})();
</script>
</body>
</html>
